org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Required so `./gradlew :domain:build` succeeds without an Android SDK installed:
# Gradle only configures modules relevant to the requested task, so Android-Gradle-Plugin
# modules (which need ANDROID_HOME) are never evaluated when only :domain is requested.
# See ../DEVELOPMENT.md.
org.gradle.configureondemand=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
