name: Android build (Windows + Git Bash)

# Reproduces the physical-device tester's environment: a Windows machine running the device
# verification driver from Git Bash. Builds both APKs with the same script the driver uses
# (scripts/device/build-apks.sh), which stops a stalled build and saves thread dumps of the
# Gradle and Kotlin daemons instead of hanging, and self-tests the driver's settings restore.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Scripts and the Gradle wrapper are checked out with LF line endings
        run: |
          bad=0
          for f in gradlew scripts/device/*.sh scripts/emulator/*.sh scripts/emulator/scenarios/*.sh; do
            if grep -q $'\r' "$f"; then echo "CRLF: $f"; bad=1; fi
          done
          git config --get core.autocrlf || true
          exit $bad

      - name: Tooling the driver needs is present in Git Bash
        run: |
          timeout --version | head -1
          curl --version | head -1
          command -v adb || ls "$ANDROID_HOME/platform-tools/adb.exe"

      - name: verify-device.sh self-test (fake adb with Windows line endings)
        run: bash scripts/device/selftest.sh

      - name: Build app + instrumentation APKs (watchdog 30 min)
        env:
          ZARVIS_BUILD_TIMEOUT_MIN: "30"
        run: ZARVIS_BUILD_ONLY=1 bash scripts/device/verify-device.sh

      # Repeatable: a second run (stops the first run's Gradle/Kotlin daemons, then rebuilds from
      # the same tree) must also finish, well within the watchdog.
      - name: Build again (fresh daemons, same tree)
        env:
          ZARVIS_BUILD_TIMEOUT_MIN: "15"
        run: ZARVIS_BUILD_ONLY=1 bash scripts/device/verify-device.sh

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-diagnostics
          path: |
            android/build/build-diagnostics/
            android/build/reports/profile/
          if-no-files-found: warn
