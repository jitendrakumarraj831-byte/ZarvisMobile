name: Android emulator verification

# Runs the app on real Android system images (emulator, KVM-accelerated) and verifies the
# Phase 1 capabilities against the actual platform: real permission dialogs, real
# special-access settings, real system services. Evidence lines (ZARVIS_EVIDENCE ...) are
# printed to the log and uploaded as an artifact per API level.
# Pull requests only (plus manual runs): each emulator matrix takes ~15 minutes per API level,
# so a branch push that also has a PR would otherwise run it twice.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Android 8.0 (oldest supported), Android 11, Android 14 (current target).
        # API 26 runs the 32-bit x86 image: its x86_64 google_apis image crash-loops System UI
        # ("System UI has stopped"), which covered Android's own permission dialogs.
        include:
          - api-level: 26
            arch: x86
          - api-level: 30
            arch: x86_64
          - api-level: 34
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator reaches the host as 10.0.2.2; the debug build is pinned to it.
      - name: Start the backend (in-memory store) on the host
        working-directory: backend
        run: |
          npm ci
          PORT=3000 nohup npx tsx src/index.ts > /tmp/backend.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf --max-time 2 http://localhost:3000/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/backend.log; exit 1

      - name: Build app + instrumentation APKs
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pzarvis.devApiHost=10.0.2.2 --stacktrace --console=plain

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: true
          working-directory: android
          script: bash scripts/emulator/verify.sh ${{ matrix.api-level }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-evidence-api${{ matrix.api-level }}
          path: |
            android/build/emulator-evidence/
            /tmp/backend.log
          if-no-files-found: warn
