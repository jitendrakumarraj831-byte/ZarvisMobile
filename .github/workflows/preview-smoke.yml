name: Live preview API smoke test

# A deployment being "Ready" is not the same as its API working. When Vercel reports a
# successful deployment (it posts a GitHub deployment_status), scripts/live-smoke.mjs calls
# the live URL the way the clients do. Only statuses and non-secret fields are logged; no
# token or password is ever printed, and the sign-up account it creates is deleted.
#
# If the deployment is behind Vercel Deployment Protection, set the repository secret
# VERCEL_AUTOMATION_BYPASS_SECRET (Vercel → Settings → Deployment Protection → Protection
# Bypass for Automation); without it a protected preview answers 401 and this job says so.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: "Deployment URL to test (https://…vercel.app)"
        required: true

# Both voice checks of a deployment, these API checks and the browser audit (the `audit` job below,
# edge-tts-live-audit.yml), speak to the same deployment. When Edge's voice is not accepted there, the
# fallback voice (Gemini) speaks, and its speech quota is small and per key: two runs at once spend it twice as
# fast and each reports the other's exhaustion. So runs take turns, and each holds both checks of its
# deployment one after the other. (A newer run may replace one that is still waiting: the newer commit's run
# follows, with both its checks.)
concurrency:
  group: live-voice-quota
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # The script from the deployed commit, so the checks match the code under test.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Health, the auth lifecycle (guest, sign-up, login, refresh rotation and replay, logout),
      # error handling, streaming, turn replay, a real model answer, a real web search, PDF
      # upload, the voice (English, Hindi and Hinglish on both endpoints, a long reply, the longest
      # WAV, cancelling, with a VOICE SUMMARY), and account deletion. See scripts/live-smoke.mjs.
      - name: Live API checks
        env:
          BASE_URL: ${{ github.event.inputs.url || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Only if the deployment sets TTS_EN_VOICE / TTS_HI_VOICE / TTS_HINGLISH_VOICE: the same names as
          # repository variables, so the voice checks expect them. Unset, the built-in voices are expected.
          EXPECT_EN_VOICE: ${{ vars.EXPECT_EN_VOICE }}
          EXPECT_HI_VOICE: ${{ vars.EXPECT_HI_VOICE }}
          EXPECT_HINGLISH_VOICE: ${{ vars.EXPECT_HINGLISH_VOICE }}
        run: node scripts/live-smoke.mjs

  # The spoken reply in a real browser (see edge-tts-live-audit.yml), after the API checks above and in the
  # same run, so the two never replace each other while waiting their turn. Previews only, and also when the
  # API checks failed: they are separate findings.
  audit:
    needs: smoke
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment != 'Production')
      )
    uses: ./.github/workflows/edge-tts-live-audit.yml
    with:
      url: ${{ github.event.inputs.url || github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
      sha: ${{ github.event.deployment.sha || github.sha }}
    secrets:
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
