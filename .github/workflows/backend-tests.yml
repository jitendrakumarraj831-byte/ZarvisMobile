name: Backend + Web checks

# Runs the full backend test suite (including the Postgres-backed store and Phase 1 security
# API tests against a real Postgres 16), both typechecks, the capability-registry parity
# check, and the web client's syntax/unit checks.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zarvis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck backend (src + tests)
        working-directory: backend
        run: npm run typecheck

      - name: Backend tests (in-memory + real Postgres)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/zarvis_test
        run: npm test

      - name: Capability registry JSON is up to date
        working-directory: backend
        run: |
          npm run capabilities:export
          git diff --exit-code -- ../shared/capability-registry.json

      - name: Install root (Vercel entrypoint) dependencies
        run: npm ci

      - name: Typecheck Vercel entrypoint (api/ + backend/src)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Web client checks
        run: |
          node --check web/app.js
          node --check web/feature-pages.js
          node --check web/sw.js
          node --check web/logic.js
          node --test web/tests/*.test.js

  web-e2e:
    # Real browser (Chromium) against the real backend + Postgres, with a local GitHub API stub.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zarvis_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install Playwright + Chromium
        run: |
          npm install -g playwright@1.56.1 axe-core@4.13.0
          npx -y playwright@1.56.1 install --with-deps chromium

      - name: Start GitHub API stub and backend
        run: |
          nohup node web/e2e/github-stub.cjs > /tmp/stub.log 2>&1 &
          cd backend
          PORT=3100 POSTGRES_URL=postgres://postgres:postgres@localhost:5432/zarvis_e2e \
            CORS_ORIGINS=http://localhost:3100 GITHUB_API_BASE_URL=http://localhost:3200 \
            nohup npx tsx src/index.ts > /tmp/backend.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf --max-time 2 http://localhost:3100/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/backend.log; exit 1

      - name: Run Phase 1 browser E2E
        env:
          ZARVIS_URL: http://localhost:3100
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/zarvis_e2e
          NODE_PATH: /usr/local/lib/node_modules
        run: node web/e2e/phase1.e2e.cjs

      # Responsive (8 views x 6 widths), axe accessibility (light + dim), keyboard, service
      # worker offline shell, voice/TTS never causing an extra turn, duplicate submissions.
      - name: Run web quality E2E
        env:
          ZARVIS_URL: http://localhost:3100
          NODE_PATH: /usr/local/lib/node_modules
        run: node web/e2e/quality.e2e.cjs

      - name: Backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true
