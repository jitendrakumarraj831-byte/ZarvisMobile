name: Android build

# The authoritative automated check that the Android app actually assembles.
# Runs on a runner that has the Android SDK installed, because :app:assembleDebug
# needs AGP, the platform SDK and the androidx artifacts from Google's Maven repo.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      # Java 17 to match every module's `kotlin { jvmToolchain(17) }` / compileOptions.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Pure-Kotlin core: compiles and unit-tests without the Android SDK at all.
      - name: Build and test :domain
        run: ./gradlew :domain:build --stacktrace --console=plain

      # Session continuity against a local HTTP server (real OkHttp/Retrofit stack): a refresh
      # failure must never replace the account; only a server session_* code ends a session.
      - name: Unit-test auth/session layer
        run: ./gradlew :data:data-remote:testDebugUnitTest :data:data-repository:testDebugUnitTest --stacktrace --console=plain

      # What the Memory, Work and Tasks screens show and do (ViewModels against a stand-in server): a failed call is reported, never shown as
      # an empty list or a zero, and a failed delete leaves the list as it was.
      - name: Unit-test the Memory, Work and Tasks view models
        run: ./gradlew :features:feature-settings:testDebugUnitTest :features:feature-home:testDebugUnitTest :features:feature-tasks:testDebugUnitTest --stacktrace --console=plain

      # Which server conversation a turn belongs to (the real orchestrator against a stand-in server): New chat clears it, the next turn starts a
      # fresh conversation, restore shows only the current one, and a turn that New chat cancelled cannot bring the old one back.
      - name: Unit-test the orchestrator's conversation handling
        run: ./gradlew :agents:testDebugUnitTest --stacktrace --console=plain

      # The dev API host is machine-specific and auto-detected from the build machine's LAN
      # address (see app/build.gradle.kts). A CI runner's address is meaningless to anyone
      # downloading the artifact, so pin it here: the uploaded APK is deterministic and
      # emulator-ready, and a build for a physical phone is made locally with
      # -Pzarvis.devApiHost=<your LAN IP> (DEVELOPMENT.md). An APK built here and side-loaded
      # onto a phone cannot reach a backend — the app says exactly that on its startup screen.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug -Pzarvis.devApiHost=10.0.2.2 --stacktrace --console=plain

      - name: Verify the APK was actually produced
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::$APK does not exist"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 0 || { echo "::error::$APK is empty"; exit 1; }
          # A valid APK is a zip carrying a binary manifest and at least one dex file.
          # Capture first, then grep a here-string: under pipefail, `cmd | grep -q` fails at random
          # when grep exits on its first match and cmd then dies of SIGPIPE.
          LISTING=$(unzip -l "$APK")
          grep -q "AndroidManifest.xml" <<<"$LISTING" || { echo "::error::no AndroidManifest.xml in APK"; exit 1; }
          grep -q "classes.dex" <<<"$LISTING" || { echo "::error::no classes.dex in APK"; exit 1; }
          # Inspect the binary manifest: the right package, version and SDK levels were built.
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)
          test -n "$AAPT2" || { echo "::error::aapt2 not found under $ANDROID_HOME/build-tools"; exit 1; }
          BADGING=$("$AAPT2" dump badging "$APK")
          echo "$BADGING" | head -n 6
          grep -q "^package: name='com.zarvismobile.app' versionCode='1' versionName='0.1.0'" <<<"$BADGING" \
            || { echo "::error::unexpected package name/versionCode/versionName in the debug APK"; exit 1; }
          grep -q "^minSdkVersion:'26'" <<<"$BADGING" || { echo "::error::minSdkVersion is not 26"; exit 1; }
          grep -q "^targetSdkVersion:'34'" <<<"$BADGING" || { echo "::error::targetSdkVersion is not 34"; exit 1; }
          grep -q "^launchable-activity:" <<<"$BADGING" || { echo "::error::no launchable activity in the debug APK"; exit 1; }

      # The base URL is compiled into BuildConfig, so this is what the app on the device
      # actually dials. Guards against the build type losing its buildConfigField.
      - name: Assert the debug build targets the configured dev backend
        run: |
          set -euo pipefail
          BUILD_CONFIG=$(find app/build/generated -path '*debug*' -name BuildConfig.java | head -n 1)
          test -n "$BUILD_CONFIG" || { echo "::error::debug BuildConfig.java not found"; exit 1; }
          echo "BuildConfig: $BUILD_CONFIG"
          grep -n 'API_BASE_URL' "$BUILD_CONFIG"
          grep -q 'API_BASE_URL = "http://10.0.2.2:3000/"' "$BUILD_CONFIG" \
            || { echo "::error::API_BASE_URL does not match -Pzarvis.devApiHost"; exit 1; }

      # The cleartext exemption must stay scoped to the dev backend host. A blanket
      # <base-config cleartextTrafficPermitted="true"> would permit plaintext to every domain
      # the app could ever talk to, which is what this repo must not ship (SECURITY.md).
      - name: Assert the cleartext exemption is scoped, not blanket
        run: |
          set -euo pipefail
          NSC=$(find app/build/generated -name network_security_config.xml | head -n 1)
          test -n "$NSC" || { echo "::error::generated network_security_config.xml not found"; exit 1; }
          echo "--- $NSC"; cat "$NSC"
          grep -q '<base-config cleartextTrafficPermitted="false" />' "$NSC" \
            || { echo "::error::base-config must keep cleartext disabled by default"; exit 1; }
          grep -q 'cleartextTrafficPermitted="true"' "$NSC" \
            || { echo "::error::no cleartext exemption at all — the dev backend is unreachable"; exit 1; }
          grep -q '<domain includeSubdomains="false">10.0.2.2</domain>' "$NSC" \
            || { echo "::error::the configured dev host is not exempted"; exit 1; }
          # Every exempted host must be a loopback/private address, never a public one.
          while read -r host; do
            case "$host" in
              localhost|127.*|10.*|192.168.*|169.254.*) ;;
              172.1[6-9].*|172.2[0-9].*|172.3[01].*) ;;
              *) echo "::error::non-private host exempted from cleartext policy: $host"; exit 1 ;;
            esac
          done < <(sed -n 's/.*<domain[^>]*>\(.*\)<\/domain>.*/\1/p' "$NSC")
          echo "OK: cleartext permitted only for the dev backend and local aliases"

      # The exemption is generated from the host the build was given, so it follows a real
      # LAN address (physical-phone development) rather than being pinned to the emulator.
      - name: Assert the exemption follows -Pzarvis.devApiHost
        run: |
          set -euo pipefail
          # Only <domain> entries grant an exemption. The file's header comment names the
          # base URL that was configured, so match the entries rather than the whole file.
          exempted_hosts() { sed -n 's/.*<domain[^>]*>\(.*\)<\/domain>.*/\1/p' "$1"; }
          ./gradlew :app:generateDebugNetworkSecurityConfig -Pzarvis.devApiHost=192.168.1.50 --console=plain
          NSC=$(find app/build/generated -name network_security_config.xml | head -n 1)
          cat "$NSC"
          grep -qx '192.168.1.50' <<<"$(exempted_hosts "$NSC")" \
            || { echo "::error::LAN dev host was not exempted"; exit 1; }
          # A public host must never be granted a cleartext exemption, even in debug.
          ./gradlew :app:generateDebugNetworkSecurityConfig -Pzarvis.devApiHost=staging.example.com --console=plain
          cat "$NSC"
          if grep -qx 'staging.example.com' <<<"$(exempted_hosts "$NSC")"; then
            echo "::error::a public host was granted a cleartext exemption"; exit 1
          fi
          echo "OK: exemption tracks the configured LAN host; public hosts stay HTTPS-only"

      # The rules for the dev API host and port, checked through Gradle itself (the logic lives in app/build.gradle.kts): which hosts may be
      # reached over cleartext HTTP, that a malformed value stops the build with a reason instead of building an unreachable URL, that the
      # port and the environment variables are honoured, and that -P wins over the environment.
      - name: Assert the dev API host and port rules
        run: |
          set -euo pipefail
          exempted_hosts() { sed -n 's/.*<domain[^>]*>\(.*\)<\/domain>.*/\1/p' "$1"; }
          nsc() { find app/build/generated -name network_security_config.xml | head -n 1; }
          build_nsc() { ./gradlew :app:generateDebugNetworkSecurityConfig -q --console=plain "$@" > /dev/null 2>&1; }

          expect_cleartext() { # host, yes|no
            build_nsc "-Pzarvis.devApiHost=$1" || { echo "::error::the build failed for dev host $1"; exit 1; }
            if grep -Fxq "$1" <<<"$(exempted_hosts "$(nsc)")"; then got=yes; else got=no; fi
            [ "$got" = "$2" ] || { echo "::error::cleartext for $1: expected $2, got $got"; exit 1; }
            echo "ok: cleartext for $1 = $got"
          }
          for host in 10.1.2.3 172.16.0.1 172.31.255.255 192.168.0.1 169.254.1.1 my-laptop.local; do expect_cleartext "$host" yes; done
          for host in 172.15.255.255 172.32.0.1 192.169.0.1 8.8.8.8 example.com; do expect_cleartext "$host" no; done

          expect_rejected() { # reason text, then the environment/arguments that make the value
            local out
            if out=$(env "$@" ./gradlew :app:generateDebugNetworkSecurityConfig -q --console=plain 2>&1); then
              echo "::error::the build accepted: $*"; exit 1
            fi
            grep -q "ZARVIS: the dev API" <<<"$out" || { echo "::error::no ZARVIS reason for: $*"; echo "$out" | tail -n 20; exit 1; }
            echo "ok: rejected $*"
          }
          expect_rejected_p() { # a -P value that must stop the build
            local out
            if out=$(./gradlew :app:generateDebugNetworkSecurityConfig -q --console=plain "$@" 2>&1); then
              echo "::error::the build accepted: $*"; exit 1
            fi
            grep -q "ZARVIS: the dev API" <<<"$out" || { echo "::error::no ZARVIS reason for: $*"; echo "$out" | tail -n 20; exit 1; }
            echo "ok: rejected $*"
          }
          expect_rejected_p "-Pzarvis.devApiHost=http://192.168.1.20"
          expect_rejected_p "-Pzarvis.devApiHost=192.168.1.20:3000"
          expect_rejected_p "-Pzarvis.devApiHost=192.168.1.20/api"
          expect_rejected_p "-Pzarvis.devApiHost=10.0.2.2" "-Pzarvis.devApiPort=70000"
          expect_rejected_p "-Pzarvis.devApiHost=10.0.2.2" "-Pzarvis.devApiPort=abc"
          expect_rejected ZARVIS_DEV_API_HOST=192.168.1.20:3000

          # The port is part of the URL the app dials.
          ./gradlew :app:generateDebugBuildConfig -q --console=plain -Pzarvis.devApiHost=10.0.2.2 -Pzarvis.devApiPort=3100 > /dev/null 2>&1
          CONFIG=$(find app/build/generated -path '*debug*' -name BuildConfig.java | head -n 1)
          grep -q 'API_BASE_URL = "http://10.0.2.2:3100/"' "$CONFIG" || { echo "::error::-Pzarvis.devApiPort is not in API_BASE_URL"; grep API_BASE_URL "$CONFIG"; exit 1; }
          ZARVIS_DEV_API_PORT=3200 ./gradlew :app:generateDebugBuildConfig -q --console=plain -Pzarvis.devApiHost=10.0.2.2 > /dev/null 2>&1
          grep -q 'API_BASE_URL = "http://10.0.2.2:3200/"' "$CONFIG" || { echo "::error::ZARVIS_DEV_API_PORT is not in API_BASE_URL"; grep API_BASE_URL "$CONFIG"; exit 1; }

          # ZARVIS_DEV_API_HOST is honoured, and -P wins over it.
          ZARVIS_DEV_API_HOST=192.168.1.61 ./gradlew :app:generateDebugNetworkSecurityConfig -q --console=plain > /dev/null 2>&1
          grep -Fxq 192.168.1.61 <<<"$(exempted_hosts "$(nsc)")" || { echo "::error::ZARVIS_DEV_API_HOST was not used"; exit 1; }
          ZARVIS_DEV_API_HOST=192.168.1.61 ./gradlew :app:generateDebugNetworkSecurityConfig -q --console=plain -Pzarvis.devApiHost=192.168.1.62 > /dev/null 2>&1
          grep -Fxq 192.168.1.62 <<<"$(exempted_hosts "$(nsc)")" || { echo "::error::-Pzarvis.devApiHost was not used"; exit 1; }
          if grep -Fxq 192.168.1.61 <<<"$(exempted_hosts "$(nsc)")"; then echo "::error::the environment variable beat -Pzarvis.devApiHost"; exit 1; fi
          echo "OK: dev API host and port rules hold"

      # Proves the cleartext permission is debug-only: it must be present in the merged
      # DEBUG manifest and absent from the merged RELEASE manifest. Guards against anyone
      # later moving the network security config out of app/src/debug/ into src/main/.
      - name: Assert cleartext config is debug-only
        run: |
          set -euo pipefail
          ./gradlew :app:processReleaseMainManifest --console=plain
          debug_manifest=$(find app/build/intermediates -path '*ebug*' -name AndroidManifest.xml \
            -path '*erged*' | head -n 1)
          release_manifest=$(find app/build/intermediates -path '*elease*' -name AndroidManifest.xml \
            -path '*erged*' | head -n 1)
          test -n "$debug_manifest"   || { echo "::error::merged debug manifest not found"; exit 1; }
          test -n "$release_manifest" || { echo "::error::merged release manifest not found"; exit 1; }
          echo "debug   : $debug_manifest"
          echo "release : $release_manifest"
          grep -q 'networkSecurityConfig' "$debug_manifest" \
            || { echo "::error::debug manifest is missing networkSecurityConfig"; exit 1; }
          if grep -q 'networkSecurityConfig\|usesCleartextTraffic="true"' "$release_manifest"; then
            echo "::error::release manifest must not enable cleartext traffic"; exit 1
          fi
          echo "OK: cleartext permitted in debug only; release untouched"

      - uses: actions/upload-artifact@v4
        with:
          # Built with -Pzarvis.devApiHost=10.0.2.2: usable on an emulator whose host machine
          # runs the backend. For a physical phone, build locally with your own LAN address.
          name: app-debug-apk-emulator
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The same debug build pointed at the deployed production backend instead of a dev server: the APK
      # to side-load on a phone. HTTPS only, so it must carry no cleartext exemption at all, not even the
      # emulator/loopback aliases (app/build.gradle.kts, -Pzarvis.apiBaseUrl).
      - name: Assemble debug APK for the production backend (Render)
        run: ./gradlew :app:assembleDebug -Pzarvis.apiBaseUrl=https://zarvismobile.onrender.com/ --stacktrace --console=plain

      - name: Assert the production debug APK dials Render over HTTPS only
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BUILD_CONFIG=$(find app/build/generated -path '*debug*' -name BuildConfig.java | head -n 1)
          test -n "$BUILD_CONFIG" || { echo "::error::debug BuildConfig.java not found"; exit 1; }
          grep -n 'API_BASE_URL' "$BUILD_CONFIG"
          grep -q 'API_BASE_URL = "https://zarvismobile.onrender.com/"' "$BUILD_CONFIG" \
            || { echo "::error::debug API_BASE_URL is not the Render backend"; exit 1; }
          if grep -q '10\.0\.2\.2' "$BUILD_CONFIG"; then echo "::error::10.0.2.2 is in the production debug BuildConfig"; exit 1; fi
          # What the APK itself carries, not only the generated source.
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          NSC=$("$AAPT2" dump xmltree --file res/xml/network_security_config.xml "$APK")
          echo "$NSC"
          grep -q 'E: base-config' <<<"$NSC" || { echo "::error::no base-config in the APK's network security config"; exit 1; }
          if grep -q 'domain-config\|10\.0\.2\.2\|127\.0\.0\.1\|localhost' <<<"$NSC"; then
            echo "::error::the production debug APK permits cleartext to some host"; exit 1
          fi
          grep -q "^package: name='com.zarvismobile.app' versionCode='1' versionName='0.1.0'" <<<"$("$AAPT2" dump badging "$APK")" \
            || { echo "::error::unexpected package name/versionCode/versionName in the production debug APK"; exit 1; }
          echo "OK: API_BASE_URL is https://zarvismobile.onrender.com/ and no host is exempted from HTTPS"

      - uses: actions/upload-artifact@v4
        with:
          # Built with -Pzarvis.apiBaseUrl=https://zarvismobile.onrender.com/: the debug APK to install on a phone.
          # It talks to the production backend, so accounts made with it are real production accounts.
          name: app-debug-apk-render
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # -Pzarvis.apiBaseUrl (or ZARVIS_API_BASE_URL) takes an https:// URL only; anything else stops the
      # build with the reason, and a missing trailing slash (which Retrofit requires) is added.
      - name: Assert the API base URL rules
        run: |
          set -euo pipefail
          for bad in "http://zarvismobile.onrender.com/" "zarvismobile.onrender.com" \
                     "https://user:pw@zarvismobile.onrender.com/" "https://zarvismobile.onrender.com/?a=1"; do
            if out=$(./gradlew :app:generateDebugBuildConfig -q --console=plain "-Pzarvis.apiBaseUrl=$bad" 2>&1); then
              echo "::error::the build accepted -Pzarvis.apiBaseUrl=$bad"; exit 1
            fi
            grep -q "ZARVIS: the API base URL" <<<"$out" || { echo "::error::no ZARVIS reason for $bad"; echo "$out" | tail -n 20; exit 1; }
            echo "ok: rejected $bad"
          done
          ZARVIS_API_BASE_URL=https://zarvismobile.onrender.com ./gradlew :app:generateDebugBuildConfig -q --console=plain > /dev/null 2>&1
          CONFIG=$(find app/build/generated -path '*debug*' -name BuildConfig.java | head -n 1)
          grep -q 'API_BASE_URL = "https://zarvismobile.onrender.com/"' "$CONFIG" \
            || { echo "::error::ZARVIS_API_BASE_URL was not used, or its trailing slash was not added"; grep API_BASE_URL "$CONFIG"; exit 1; }
          echo "OK: API base URL rules hold"

      # No RELEASE_STORE_FILE/etc. secrets are configured for this workflow (see
      # app/build.gradle.kts and DEVELOPMENT.md "Release build & signing"), so this proves
      # the release variant actually compiles/assembles — a real compile-verification signal
      # this repo previously had no way to get at all — without ever holding or inventing a
      # production signing key in CI.
      - name: Assemble release APK + AAB (unsigned — no signing credentials in this workflow)
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace --console=plain

      - name: Verify the release artifacts were actually produced
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$APK" || { echo "::error::$APK does not exist"; exit 1; }
          test -f "$AAB" || { echo "::error::$AAB does not exist"; exit 1; }
          echo "release APK size: $(stat -c%s "$APK") bytes"
          echo "release AAB size: $(stat -c%s "$AAB") bytes"
          grep -q "classes.dex" <<<"$(unzip -l "$APK")" || { echo "::error::no classes.dex in release APK"; exit 1; }

      # Guards against the release build type losing its buildConfigField, or (worse)
      # silently inheriting a dev/localhost URL — see the debug-side assertion above.
      - name: Assert the release build targets the production backend
        run: |
          set -euo pipefail
          BUILD_CONFIG=$(find app/build/generated -path '*release*' -name BuildConfig.java | head -n 1)
          test -n "$BUILD_CONFIG" || { echo "::error::release BuildConfig.java not found"; exit 1; }
          grep -n 'API_BASE_URL' "$BUILD_CONFIG"
          grep -q 'API_BASE_URL = "https://zarvismobile.onrender.com/"' "$BUILD_CONFIG" \
            || { echo "::error::release API_BASE_URL is not the production backend"; exit 1; }

      # Inspect every artifact rather than trusting Gradle's exit code: size, identity,
      # versions and SDK levels from the binary manifest, and the AAB's manifest via bundletool.
      - name: Artifact report (debug APK, release APK, release AAB)
        run: |
          set -euo pipefail
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            echo "=== $APK ($(stat -c%s "$APK") bytes)"
            BADGING=$("$AAPT2" dump badging "$APK")
            grep -E "^(package|sdkVersion|minSdkVersion|targetSdkVersion|launchable-activity|uses-feature|application-debuggable)" <<<"$BADGING" || true
            grep -q "^package: name='com.zarvismobile.app' versionCode='1' versionName='0.1.0'.*compileSdkVersion='34'" <<<"$BADGING" \
              || { echo "::error::$APK: unexpected identity or compileSdkVersion"; exit 1; }
            echo "dex files: $(unzip -l "$APK" | grep -c 'classes[0-9]*\.dex')"
          done
          # A release APK must not be debuggable. (A piped `grep -q` here could hide a match: the
          # match makes aapt2 die of SIGPIPE, and pipefail then turns the `if` false.)
          if grep -q application-debuggable <<<"$("$AAPT2" dump badging app/build/outputs/apk/release/app-release-unsigned.apk)"; then
            echo "::error::release APK is debuggable"; exit 1
          fi
          AAB=app/build/outputs/bundle/release/app-release.aab
          echo "=== $AAB ($(stat -c%s "$AAB") bytes)"
          curl -sSL -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          java -jar /tmp/bundletool.jar dump manifest --bundle "$AAB" > /tmp/aab-manifest.xml
          grep -E 'package=|versionCode|versionName|uses-sdk|minSdkVersion|targetSdkVersion|compileSdkVersion' /tmp/aab-manifest.xml | head -10
          grep -q 'package="com.zarvismobile.app"' /tmp/aab-manifest.xml || { echo "::error::AAB package mismatch"; exit 1; }
          grep -q 'android:versionCode="1"' /tmp/aab-manifest.xml || { echo "::error::AAB versionCode mismatch"; exit 1; }
          grep -q 'android:targetSdkVersion="34"' /tmp/aab-manifest.xml || { echo "::error::AAB targetSdk mismatch"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          # UNSIGNED: this workflow holds no signing credentials (by design — see
          # DEVELOPMENT.md). Not installable on a device or uploadable to Play Console as-is;
          # proves only that the release variant compiles. Sign locally or in a workflow that
          # has real RELEASE_STORE_FILE/etc. secrets before distributing.
          name: app-release-unsigned
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # On a phone (android/scripts/termux/assemble-debug.sh) the x86_64 aapt2 that AGP downloads cannot run, so
      # android.aapt2FromMavenOverride points AGP at Termux's native aapt2 instead. This runner cannot run an ARM64
      # program, but it proves the rest: AGP honours the property, and the app builds with a standalone aapt2
      # newer than AGP's own (the SDK's latest build-tools, the same generation as Termux's aapt2 package).
      # Runs last, after every artifact above has been uploaded.
      - name: Assemble with a standalone aapt2 (android.aapt2FromMavenOverride, as on Termux)
        run: |
          set -euo pipefail
          REAL=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          echo "standalone aapt2: $REAL ($("$REAL" version 2>&1 | head -n 1))"
          DIR="$RUNNER_TEMP/aapt2-override"
          mkdir -p "$DIR"
          # A logging stand-in named aapt2, so the log proves the build ran this one and not the downloaded one.
          printf '#!/usr/bin/env bash\necho "$*" >> "%s"\nexec "%s" "$@"\n' "$DIR/calls.log" "$REAL" > "$DIR/aapt2"
          chmod +x "$DIR/aapt2"
          ./gradlew :app:clean :app:assembleDebug --no-build-cache -Pzarvis.apiBaseUrl=https://zarvismobile.onrender.com/ \
            "-Pandroid.aapt2FromMavenOverride=$DIR/aapt2" --stacktrace --console=plain
          test -s "$DIR/calls.log" || { echo "::error::the build never ran the aapt2 given by android.aapt2FromMavenOverride"; exit 1; }
          echo "aapt2 runs through the override: $(wc -l < "$DIR/calls.log")"; head -n 5 "$DIR/calls.log"
          test -f app/build/outputs/apk/debug/app-debug.apk || { echo "::error::no debug APK from the override build"; exit 1; }

  # The Android side of "can the app reach the backend" is only half the story: the backend
  # has to answer on a non-loopback address, which is what a phone actually dials. This job
  # runs the same check a developer runs before building for a device.
  dev-backend-reachability:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Syntax-check web client
        run: node --check web/app.js

      - name: Start the dev backend
        working-directory: backend
        run: |
          set -euo pipefail
          # nohup + disown so the server survives this step's shell exiting.
          nohup npm run dev > /tmp/backend.log 2>&1 &
          disown || true
          for _ in $(seq 1 60); do
            if curl -sf --max-time 2 http://127.0.0.1:3000/health >/dev/null; then
              echo "backend is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not become healthy"; cat /tmp/backend.log; exit 1

      # No arguments: exercises the same LAN auto-detection the Gradle build uses, then
      # proves the backend answers on that address and not merely on loopback.
      - name: Check the backend is reachable over the LAN
        run: ./scripts/check-dev-backend.sh

  # Every module's JVM unit tests and Android Lint, which the assemble job above does not run.
  # --continue reports every failing module in one run instead of stopping at the first.
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint (all modules)
        run: ./gradlew clean test lint -Pzarvis.devApiHost=10.0.2.2 --continue --stacktrace --console=plain

      - name: Full check (all modules)
        run: ./gradlew check -Pzarvis.devApiHost=10.0.2.2 --continue --stacktrace --console=plain

      # Every lint finding in the log (the HTML/XML reports are also uploaded below), and a
      # gate: only the documented, deliberately deferred ids may remain — dependency/AGP
      # "newer version available" notices and targetSdk 34 (a tracked Play-release blocker,
      # changed in its own PR because it changes runtime behaviour). Anything else fails.
      - name: List lint findings and enforce zero new warnings
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          DEFERRED = {"GradleDependency", "AndroidGradlePluginVersion", "OldTargetApi"}
          seen, unexpected = set(), []
          for path in sorted(glob.glob("**/build/reports/lint-results-*.xml", recursive=True)):
              for issue in ET.parse(path).getroot().iter("issue"):
                  loc = issue.find("location")
                  where = f"{loc.get('file')}:{loc.get('line')}" if loc is not None else "?"
                  key = (issue.get("id"), where, issue.get("message"))
                  if key in seen:
                      continue  # the same finding reported by several modules
                  seen.add(key)
                  print(f"{issue.get('severity')}: [{issue.get('id')}] {where}\n    {issue.get('message')}")
                  if issue.get("id") not in DEFERRED:
                      unexpected.append(key)
          print(f"unique lint findings: {len(seen)}; outside the deferred set: {len(unexpected)}")
          for key in unexpected:
              print(f"::error::lint [{key[0]}] {key[1]}: {key[2]}")
          sys.exit(1 if unexpected else 0)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-and-test-reports
          path: |
            android/**/build/reports/lint-results-*.html
            android/**/build/reports/lint-results-*.xml
            android/**/build/reports/tests/
          if-no-files-found: warn
